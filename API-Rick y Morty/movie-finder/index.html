<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Películas</title>
  <!-- Bootstrap 5.3 CDN -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-dark text-light min-vh-100 py-4">

  <main class="container">
    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold text-primary">🎬 Buscador de Películas</h1>
      <p class="text-secondary">
        Consulta de películas con fetch y manipulación dinámica del DOM
      </p>
    </header>

    <!-- Controles de Búsqueda (Paso 1 y Funcionalidades Requeridas) -->
    <section class="card bg-secondary bg-opacity-10 border-secondary mb-4 p-3">
      <form id="form-busqueda" class="row g-2 align-items-center">
        <div class="col-12 col-md-9">
          <input type="text" id="input-pelicula" class="form-control"
                 placeholder="Escribe el nombre de una película (ej: Inception, Batman)..." required>
        </div>
        <div class="col-12 col-md-3 d-grid">
          <button type="submit" id="btn-buscar" class="btn btn-primary fw-bold">
            🔍 Buscar
          </button>
        </div>
      </form>
    </section>

    <!-- Estado 1: cargando -->
    <div id="loading" class="text-center py-5 d-none">
      <div class="spinner-border text-primary" role="status"
           style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-2 text-secondary">Buscando películas en la base de datos...</p>
    </div>

    <!-- Estado 2: error / manejo de errores (Paso 4) -->
    <div id="alerta-error" class="alert alert-danger d-none" role="alert">
      <span class="fw-bold">⚠️ Error:</span> <span id="error-mensaje"></span>
    </div>

    <!-- Estado 3: éxito / contenedor de resultados (Paso 3) -->
    <section id="contenedor-tarjetas"
             class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3">
    </section>
  </main>

  <!-- JavaScript de Bootstrap -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
